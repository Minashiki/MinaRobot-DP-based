[build-system]
requires = ["setuptools>=71,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "feedingrobot"
version = "0.1.0"
description = "Native MuJoCo feeding robot rebuild with RGB observations and delta control"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco==3.14.0", "numpy==2.2.6", "mink==1.3.0", "diffusers==0.39.0", "h5py==3.16.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
